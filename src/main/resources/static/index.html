<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>数据库工作台</title>
    <link rel="icon" type="image/svg+xml" href="/workbench/favicon.svg" />
    <link rel="stylesheet" href="/workbench/workbench.css" />
    <link rel="stylesheet" href="/workbench/menus.css" />
  </head>
  <body>
    <div id="app"><div class="boot-state">正在打开数据库工作台…</div></div>

      aria-live="polite"

    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <input id="sql-file" type="file" accept=".sql,.txt" hidden />
    <script type="module" src="/workbench/app.js"></script>
  </body>
</html>
